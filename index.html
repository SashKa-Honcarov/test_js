<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Основи JavaScript</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --correct-color: #22c55e;
            --incorrect-color: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 650px;
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        .header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress {
            height: 100%;
            background-color: var(--accent-color);
            width: 10%;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 0.875rem;
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .question-text {
            font-size: 1.125rem;
            margin: 20px 0;
            line-height: 1.5;
        }

        code {
            background-color: #090d16;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #f43f5e;
            font-size: 0.95em;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option-btn {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            color: var(--text-color);
            font-size: 0.975rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            background-color: rgba(99, 102, 241, 0.1);
            border-color: var(--accent-color);
        }

        .option-btn.selected {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.2);
        }

        .option-btn.correct {
            background-color: rgba(34, 197, 94, 0.2);
            border-color: var(--correct-color);
            color: #86efac;
        }

        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--incorrect-color);
            color: #fca5a5;
        }

        .footer {
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            text-align: center;
            padding: 10px 0;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2rem;
            font-weight: 700;
        }

        .result-message {
            font-size: 1.25rem;
            margin-bottom: 24px;
            color: var(--text-muted);
        }

        .hide {
            display: none;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-screen">
            <div class="header">
                <span class="question-number" id="q-number">Питання 1 з 10</span>
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
            </div>
            
            <div class="question-text" id="q-text"></div>
            <div class="options-container" id="options"></div>
            
            <div class="footer">
                <button class="btn" id="next-btn" disabled>Далі</button>
            </div>
        </div>

        <div id="result-screen" class="results hide">
            <h1>Тестування завершено</h1>
            <div class="score-circle" id="score">0/10</div>
            <p class="result-message" id="result-text"></p>
            <button class="btn" onclick="location.reload()">Пройти знову</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Який тег використовується для підключення JavaScript у HTML-документ?",
                options: ["&lt;script&gt;", "&lt;js&gt;", "&lt;javascript&gt;", "&lt;code&gt;"],
                correct: 0
            },
            {
                question: "Яке ключове слово НЕ використовується для оголошення змінних у сучасному JS?",
                options: ["let", "const", "var", "dim"],
                correct: 3
            },
            {
                question: "Що виведе в консоль оператор <code>console.log(typeof 42)</code>?",
                options: ["'string'", "'number'", "'boolean'", "'undefined'"],
                correct: 1
            },
            {
                question: "Який результат виконання виразу <code>'5' + 3</code>?",
                options: ["8", "'53'", "NaN", "Error"],
                correct: 1
            },
            {
                question: "Який метод виводить модальне вікно з повідомленням та кнопкою 'ОК'?",
                options: ["prompt()", "confirm()", "alert()", "print()"],
                correct: 2
            },
            {
                question: "Який оператор перевіряє рівність за значенням та типом даних (строге порівняння)?",
                options: ["==", "=", "===", "!="],
                correct: 2
            },
            {
                question: "Як правильно написати однорядковий коментар у JavaScript?",
                options: ["&lt;!-- Коментар --&gt;", "/* Коментар */", "// Коментар", "# Коментар"],
                correct: 2
            },
            {
                question: "Що повернує вираз <code>Boolean('')</code> (порожній рядок)?",
                options: ["true", "false", "undefined", "null"],
                correct: 1
            },
            {
                question: "Яка з цих назв змінних є НЕКОРЕКТНОЮ у JavaScript?",
                options: ["myVariable", "_user", "$price", "2names"],
                correct: 3
            },
            {
                question: "Яке значення має змінна, оголошена через <code>let x;</code> без присвоєння значення?",
                options: ["null", "0", "undefined", "false"],
                correct: 2
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const scoreElement = document.getElementById('score');
        const resultText = document.getElementById('result-text');

        function loadQuestion() {
            selectedOption = null;
            nextBtn.disabled = true;
            nextBtn.innerText = currentQuestion === quizData.length - 1 ? 'Завершити' : 'Далі';

            const current = quizData[currentQuestion];
            qNumber.innerText = `Питання ${currentQuestion + 1} з ${quizData.length}`;
            qText.innerHTML = current.question;
            progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

            optionsContainer.innerHTML = '';
            current.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerHTML = option;
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(index) {
            selectedOption = index;
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.classList.toggle('selected', idx === index);
            });
            nextBtn.disabled = false;
        }

        nextBtn.onclick = () => {
            if (selectedOption === null) return;

            const buttons = optionsContainer.querySelectorAll('.option-btn');
            const correctIndex = quizData[currentQuestion].correct;

            buttons.forEach(btn => btn.disabled = true);

            if (selectedOption === correctIndex) {
                buttons[selectedOption].classList.add('correct');
                score++;
            } else {
                buttons[selectedOption].classList.add('incorrect');
                buttons[correctIndex].classList.add('correct');
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1000);
        };

        function showResults() {
            quizScreen.classList.add('hide');
            resultScreen.classList.remove('hide');
            scoreElement.innerText = `${score}/${quizData.length}`;

            const percentage = (score / quizData.length) * 100;
            if (percentage === 100) {
                resultText.innerText = "Відмінний результат! Ви чудово знаєте основи JavaScript.";
            } else if (percentage >= 70) {
                resultText.innerText = "Добре! Ви маєте міцну базу, але є незначні прогалини.";
            } else if (percentage >= 50) {
                resultText.innerText = "Задовільно. Варто повторити базові теми.";
            } else {
                resultText.innerText = "Спробуйте ще раз! Рекомендуємо пройтися по синтаксису та типам даних.";
            }
        }

        loadQuestion();
    </script>
</body>
</html>
